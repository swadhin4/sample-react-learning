<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuFlow - Bootstrap Enterprise Portal</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Clean Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;850&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #eef2f7 0%, #d6e0ea 100%);
        background-attachment: fixed;
        min-height: 100vh;
      }

      /* Glassmorphism cards with interactive 3D depth and hover lifting */
      .glass-3d-card {
        background: rgba(255, 255, 255, 0.55) !important;
        backdrop-filter: blur(12px) saturate(180%) !important;
        -webkit-backdrop-filter: blur(12px) saturate(180%) !important;
        border: 2px solid rgba(108, 117, 125, 0.25) !important;
        border-radius: 12px !important;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05), 
                    6px 6px 0px rgba(108, 117, 125, 0.1),
                    inset 0 1px 1px 0 rgba(255, 255, 255, 0.6) !important;
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1) !important;
      }

      .glass-3d-card:hover {
        transform: translateY(-4px) !important;
        box-shadow: 0 16px 36px 0 rgba(31, 38, 135, 0.1), 
                    10px 10px 0px rgba(108, 117, 125, 0.15),
                    inset 0 1px 1px 0 rgba(255, 255, 255, 0.8) !important;
        border-color: rgba(108, 117, 125, 0.45) !important;
      }

      /* Inputs styled for glassmorphism */
      .glass-input {
        background: rgba(255, 255, 255, 0.75) !important;
        border: 2px solid rgba(108, 117, 125, 0.3) !important;
        border-radius: 6px !important;
        transition: all 0.2s ease-in-out !important;
      }

      .glass-input:focus {
        background: rgba(255, 255, 255, 0.95) !important;
        border-color: #6c757d !important;
        box-shadow: 0 0 0 0.2rem rgba(108, 117, 125, 0.2) !important;
        outline: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6Rz83916wVD5ILyTs9eZ6YX81Mg17a8W12Y+1h35zYTsvhLPVnYs9eStHfGJvOv" crossorigin="anonymous"></script>
  </body>
</html>
